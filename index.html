<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>بوصلة مستقبلك</title>

<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&display=swap">
<style>
/* Layout: soft-UI phone column; raised cards on one grey ground, rings and bars carry the numbers */
:root{
  --bg:#ECEFF4; --raise-l:#FFFFFF; --raise-d:#C9D0DB; --fg:#22324A; --muted:#7A879A; --line:#DDE2EA;
  --pink:#EF5A7E; --orange:#F5A63A; --teal:#25B99A; --blue:#3A9FE0; --purple:#8B6CF0; --navy:#22324A;
  --track:#DFE4EC; --onaccent:#FFFFFF;
  --font:'IBM Plex Sans Arabic',system-ui,-apple-system,'Segoe UI',Tahoma,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1F242D; --raise-l:#2A313C; --raise-d:#14181E; --fg:#E7ECF3; --muted:#98A4B5; --line:#323A46;
  --pink:#F27392; --orange:#F7B457; --teal:#3CCBAC; --blue:#5BB2EA; --purple:#A08AF5; --navy:#E7ECF3; --track:#2B323D; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1F242D; --raise-l:#2A313C; --raise-d:#14181E; --fg:#E7ECF3; --muted:#98A4B5; --line:#323A46;
  --pink:#F27392; --orange:#F7B457; --teal:#3CCBAC; --blue:#5BB2EA; --purple:#A08AF5; --navy:#E7ECF3; --track:#2B323D; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:15px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px;box-sizing:border-box}
*{box-sizing:border-box}
.app{max-width:420px;margin:0 auto;min-height:calc(100% - 4px);display:flex;flex-direction:column}
.raised{background:var(--bg);border-radius:22px;box-shadow:7px 7px 16px var(--raise-d),-7px -7px 16px var(--raise-l)}
.inset{background:var(--bg);border-radius:18px;box-shadow:inset 4px 4px 9px var(--raise-d),inset -4px -4px 9px var(--raise-l)}
.top{display:flex;align-items:center;justify-content:space-between;padding:10px 4px 6px;gap:10px}
.brand{display:flex;flex-direction:column;gap:2px}
.brand .nm{font-size:20px;line-height:1.2;font-weight:300}
.brand .nm b{font-weight:700}
.dots{display:flex;gap:5px}
.dots i{width:7px;height:7px;border-radius:50%}
.dots i:nth-child(1){background:var(--pink)}.dots i:nth-child(2){background:var(--orange)}.dots i:nth-child(3){background:var(--teal)}
.badge{width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--pink)}
.proto{font-size:11px;color:var(--muted);text-align:center;padding:2px 0 8px}
.back{background:none;border:0;color:var(--muted);font:inherit;font-size:14px;cursor:pointer;padding:6px 2px}
.screen{flex:1;padding:12px 4px 18px;display:flex;flex-direction:column;gap:18px;min-width:0}
h1,h2{margin:0;text-wrap:balance;line-height:1.4;font-weight:300}
h1 b,h2 b{font-weight:700}
h1{font-size:26px} h2{font-size:22px}
p{margin:0}
.muted{color:var(--muted)} .small{font-size:13px}
.btn{display:block;width:100%;border:0;border-radius:18px;padding:14px;font:inherit;font-weight:700;font-size:15px;cursor:pointer;text-align:center;color:var(--onaccent);
  background:linear-gradient(135deg,var(--blue),var(--purple));box-shadow:6px 6px 14px var(--raise-d),-6px -6px 14px var(--raise-l)}
.btn.soft{background:var(--bg);color:var(--fg)}
.btn.warm{background:linear-gradient(135deg,var(--orange),var(--pink))}
.btn:active{box-shadow:inset 4px 4px 9px var(--raise-d),inset -4px -4px 9px var(--raise-l)}
button:focus-visible{outline:3px solid var(--blue);outline-offset:3px}
.mt-auto{margin-top:auto}
.stack{display:flex;flex-direction:column;gap:14px}
.progress{height:9px;border-radius:6px;overflow:hidden;padding:2px}
.progress i{display:block;height:100%;border-radius:4px;background:linear-gradient(90deg,var(--teal),var(--blue));transition:width .3s}
.act{padding:30px 18px;display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center}
.act .ic{width:76px;height:76px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:34px}
.scale{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.sc{border:0;font:inherit;color:var(--fg);cursor:pointer;padding:14px 6px;border-radius:18px;display:flex;flex-direction:column;align-items:center;gap:8px;font-weight:600;font-size:14px;
  background:var(--bg);box-shadow:6px 6px 13px var(--raise-d),-6px -6px 13px var(--raise-l)}
.sc .lv{display:flex;gap:4px}
.sc .lv i{width:9px;height:9px;border-radius:50%;background:var(--track)}
.sc[aria-pressed="true"]{box-shadow:inset 4px 4px 9px var(--raise-d),inset -4px -4px 9px var(--raise-l)}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.seg button{border:0;font:inherit;color:var(--fg);cursor:pointer;padding:12px;border-radius:16px;font-weight:600;background:var(--bg);box-shadow:5px 5px 12px var(--raise-d),-5px -5px 12px var(--raise-l)}
.seg button[aria-pressed="true"]{box-shadow:inset 4px 4px 9px var(--raise-d),inset -4px -4px 9px var(--raise-l);color:var(--blue)}
input[type=text]{width:100%;border:0;border-radius:16px;padding:13px 15px;font:inherit;color:var(--fg);background:var(--bg);box-shadow:inset 4px 4px 9px var(--raise-d),inset -4px -4px 9px var(--raise-l)}
input::placeholder{color:var(--muted)}
label,.lbl{font-size:14px;font-weight:600}
.panel{padding:16px;display:flex;flex-direction:column;gap:12px}
.rings{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.ringcard{padding:14px 6px 10px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:13px;font-weight:600}
.card{border:0;font:inherit;color:var(--fg);width:100%;text-align:start;padding:12px 14px;display:flex;align-items:center;gap:12px}
.card .cmain{border:0;background:none;font:inherit;color:inherit;flex:1;min-width:0;display:flex;align-items:center;gap:12px;text-align:start;cursor:pointer;padding:0}
.nope{border:0;background:none;font:inherit;color:var(--muted);cursor:pointer;display:flex;flex-direction:column;align-items:center;font-size:16px;gap:0;padding:4px}
.nope span{font-size:10.5px}
.card .tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.card .nm{font-weight:700;font-size:15px}
.light{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;border-radius:999px;padding:2px 10px 2px 8px;background:var(--bg);box-shadow:inset 2px 2px 5px var(--raise-d),inset -2px -2px 5px var(--raise-l);width:max-content}
.dot{width:9px;height:9px;border-radius:50%;flex:none}
.g{color:var(--teal)} .g .dot{background:var(--teal)}
.y{color:var(--orange)} .y .dot{background:var(--orange)}
.r{color:var(--pink)} .r .dot{background:var(--pink)}
.legend{display:flex;justify-content:center;gap:12px;flex-wrap:wrap}
.tags{display:flex;flex-wrap:wrap;gap:8px}
.tag{border-radius:999px;padding:5px 12px;font-size:13px;background:var(--bg);box-shadow:3px 3px 7px var(--raise-d),-3px -3px 7px var(--raise-l)}
.sec h3{margin:0 0 8px;font-size:15px}
.chat{display:flex;flex-direction:column;gap:12px;flex:1;min-height:180px;overflow-y:auto;padding:14px}
.msg{max-width:86%;border-radius:18px;padding:10px 13px;font-size:14px;line-height:1.65}
.msg.me{align-self:flex-start;background:linear-gradient(135deg,var(--blue),var(--purple));color:var(--onaccent)}
.msg.bot{align-self:flex-end;background:var(--bg);box-shadow:4px 4px 10px var(--raise-d),-4px -4px 10px var(--raise-l)}
.ask{display:flex;gap:8px}
.ask input{flex:1;min-width:0}
.chips{display:flex;flex-wrap:wrap;gap:9px}
.chip{border:0;font:inherit;color:var(--fg);cursor:pointer;border-radius:999px;padding:7px 13px;font-size:13px;font-weight:600;background:var(--bg);box-shadow:4px 4px 9px var(--raise-d),-4px -4px 9px var(--raise-l)}
.chip[aria-pressed="true"]{box-shadow:inset 3px 3px 7px var(--raise-d),inset -3px -3px 7px var(--raise-l);color:var(--blue)}
.majorpick{display:flex;gap:9px;overflow-x:auto;padding:6px 6px 10px}
.majorpick .chip{white-space:nowrap}
.reel{position:relative;border-radius:24px;min-height:440px;overflow:hidden;color:#FFFFFF;display:flex;flex-direction:column;justify-content:flex-end;padding:16px;box-shadow:7px 7px 16px var(--raise-d),-7px -7px 16px var(--raise-l)}
.reel .face{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding-bottom:130px}
.reel .face span{width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.22);display:flex;align-items:center;justify-content:center;font-size:46px;font-weight:700}
.reel .side{text-shadow:0 1px 3px rgba(0,0,0,.6)}
.reel .rv{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.reel .mute{position:absolute;top:14px;inset-inline-end:14px;border:0;font:inherit;font-size:12px;color:#fff;background:rgba(0,0,0,.4);border-radius:999px;padding:4px 11px;cursor:pointer;z-index:2}
.reel .play{position:absolute;top:14px;inset-inline-start:14px;background:rgba(0,0,0,.28);border-radius:999px;padding:3px 11px;font-size:12px}
.reel .side{position:absolute;z-index:1;inset-inline-end:14px;top:120px;display:flex;flex-direction:column;gap:18px;align-items:center;font-size:11px}
.reel .side svg{width:24px;height:24px;display:block;margin:0 auto 2px}
.reel .cap{position:relative;z-index:1;display:flex;flex-direction:column;gap:6px;background:linear-gradient(0deg,rgba(0,0,0,.5),rgba(0,0,0,0));margin:-16px;padding:46px 16px 16px}
.reel .quote{background:rgba(0,0,0,.35);border-radius:12px;padding:9px 12px;font-size:14px;line-height:1.6}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.nav{display:grid;grid-template-columns:repeat(4,1fr);margin:6px 0 4px;padding:6px}
.nav button{background:none;border:0;font:inherit;font-size:12px;color:var(--muted);padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;border-radius:16px}
.nav button[aria-current="page"]{color:var(--blue);font-weight:700;box-shadow:inset 3px 3px 7px var(--raise-d),inset -3px -3px 7px var(--raise-l)}
.nav svg{width:22px;height:22px}
.sharecard{padding:16px;display:flex;flex-direction:column;gap:10px;font-size:14px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.note{font-size:12px;color:var(--muted);text-align:center}
.steps{display:flex;flex-direction:column;gap:12px}
.step{display:flex;gap:12px;align-items:center;padding:12px 14px}
.step b{width:34px;height:34px;border-radius:50%;color:#FFFFFF;display:flex;align-items:center;justify-content:center;flex:none;font-size:15px}
.showall{align-self:center}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
#printrep{display:none}
a.btn{text-decoration:none}
@media print{body>*:not(#printrep){display:none!important}#printrep{display:block;direction:rtl;font-family:'IBM Plex Sans Arabic',system-ui,sans-serif;color:#1C2B39;padding:24px}
#printrep h1{font-size:24px;margin:0 0 4px;color:#1E3A5F}#printrep .m{border:1px solid #ddd;border-radius:12px;padding:12px 16px;margin:12px 0;break-inside:avoid}#printrep .m h2{font-size:18px;margin:0 0 6px}#printrep p{margin:4px 0;font-size:13px;line-height:1.7}#printrep .muted{color:#667}}
</style>


</head>

function profile(){const raw={},cnt={};Object.keys(DIMS).forEach(k=>{raw[k]=0;cnt[k]=0;});const QL=QQ();S.ans.forEach((v,i)=>{if(v!=null&&v!=='x'&&QL[i]){raw[QL[i][0]]+=v;cnt[QL[i][0]]++;}});const pct={};for(const k in raw)pct[k]=cnt[k]?Math.round(100*raw[k]/(2*cnt[k])):0;return {raw,pct};}
function valFit(m){const V=S.val||{};let s=0,n=0;const has=c=>m.v.includes(c);
 if(V.long){n++;s+=V.long==='a'?(has('L')?1:.6):(has('L')?0:1);}
 if(V.st){n++;s+=V.st==='a'?(has('S')?1:has('D')?.3:.6):(has('D')?1:has('S')?.3:.6);}
 if(V.pe){n++;s+=V.pe==='a'?(has('P')?1:has('O')?.3:.6):(has('O')?1:has('P')?.3:.6);}
 if(V.loc){n++;s+=V.loc==='a'?(has('R')?.2:1):1;}
 if(V.fi){n++;s+=V.fi==='a'?(has('F')?1:has('W')?.3:.6):(has('W')?1:has('F')?.3:.6);}
 return n?s/n:.7;}
function abFit(m){const A=S.ab||{};let s=0,w=0;for(const k in m.sub){s+=m.sub[k]*(A[k]==null?1:A[k]);w+=m.sub[k]*2;}return w?s/w:.5;}
function matches(){const {pct}=profile();const mx=Math.max(1,...Object.values(pct));
  return M.map(m=>{let s=0,wt=0;for(const k in m.w){s+=m.w[k]*pct[k];wt+=m.w[k];}const iF=(s/wt)/mx,aF=abFit(m),vF=valFit(m);
   return {...m,iS:Math.round(100*iF),aS:Math.round(100*aF),vS:Math.round(100*vF),score:Math.round(35+60*(.55*iF+.25*aF+.2*vF))};}).sort((a,b)=>b.score-a.score);}
